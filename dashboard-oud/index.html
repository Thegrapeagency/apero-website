<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APÉRO Studio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<div class="studio">
  <!-- zijbalk -->
  <aside class="zijbalk" id="zijbalk">
    <div class="zmerk">AP&Eacute;R<span class="flower"></span><span class="sub">STUDIO</span></div>
    <nav class="znav" id="znav">
      <div class="zkop">Vandaag</div>
      <button class="zlink" data-m="overzicht"><span class="zi">&#10047;</span>Overzicht</button>
      <div class="zkop">Redactie</div>
      <button class="zlink" data-m="publicaties"><span class="zi">&para;</span>Publicaties<span class="tel" id="telPub"></span></button>
      <button class="zlink" data-m="generator"><span class="zi">&#9635;</span>Carrousel-generator</button>
      <button class="zlink" data-m="instagram"><span class="zi">&#9673;</span>Instagram<span class="tel" id="telIG"></span></button>
      <div class="zkop">Festival</div>
      <button class="zlink" data-m="partners"><span class="zi">&#9733;</span>Partners<span class="tel" id="telPartners"></span></button>
      <button class="zlink" data-m="tickets"><span class="zi">&#9634;</span>Ticketshop</button>
      <button class="zlink" data-m="festival"><span class="zi">&#9650;</span>Draaiboek</button>
      <div class="zkop">Inzicht &amp; beheer</div>
      <button class="zlink" data-m="stats"><span class="zi">&#9632;</span>Statistieken</button>
      <button class="zlink" data-m="merk"><span class="zi">&#10022;</span>Merk &amp; assets</button>
      <button class="zlink" data-m="app"><span class="zi">&#9707;</span>Site &amp; app</button>
      <button class="zlink" data-m="instellingen"><span class="zi">&#8943;</span>Instellingen</button>
    </nav>
    <div class="zvoet">APÉRO Culture · Studio<br><a href="../index.html">www.apero-culture.com</a></div>
  </aside>

  <!-- werkvlak -->
  <main class="werk">
    <div class="topbar">
      <button class="menuknop" id="menuknop">&#9776;</button>
      <div class="tkop" id="tkop">Overzicht</div>
      <button class="tzoek" id="cpOpen"><span>Zoek of spring&hellip;</span><kbd>&#8984;K</kbd></button>
      <a class="tlink" href="../index.html" target="_blank">Bekijk site &rarr;</a>
    </div>
    <div class="paneel" id="paneel"></div>
  </main>
</div>

<!-- command palette -->
<div class="cp-scrim" id="cpScrim"></div>
<div class="cp" id="cp">
  <input id="cpInput" type="text" placeholder="Typ om te zoeken: modules, acties, partners, assets&hellip;" autocomplete="off">
  <div class="cplijst" id="cpLijst"></div>
</div>

<!-- zijmodaal -->
<div class="mscrim" id="mscrim"></div>
<div class="modaal" id="modaal">
  <div class="mhead"><h3 id="mtitel"></h3><button class="msluit" id="msluit">&times;</button></div>
  <div class="mbody" id="mbody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="studio.js"></script>
</body>
</html>
