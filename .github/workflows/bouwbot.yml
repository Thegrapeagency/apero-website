# De bouwbot: pakt bouwverzoeken uit APÉRO Studio op en maakt een testversie op een eigen branch.
# Starten gebeurt via het label "bouwverzoek" op een issue, of met @claude in een reactie (feedback).
name: Bouwbot
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: bouwbot-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  bouw:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'bouwverzoek') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: bouwverzoek
          trigger_phrase: '@claude'
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(node tools/bouw.mjs),Bash(node --check:*),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch"
